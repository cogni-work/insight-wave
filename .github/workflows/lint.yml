name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  breadcrumb-guard:
    name: Maintainer-breadcrumb guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard reads the working
        # tree via `git ls-files` (the index at this commit), not git history.

      - name: Check for maintainer breadcrumbs in SKILL.md + agents
        run: |
          set -euo pipefail
          python3 scripts/check-breadcrumbs.py

  external-dispatch-guard:
    name: External-dispatch guard (retired-prefix and unresolved-target arms)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard reads the working
        # tree via `git ls-files`, not git history.

      # Keep this name free of ": " — an unquoted YAML plain scalar containing a
      # colon-space makes the whole workflow unparseable, which silently takes
      # every job in this file offline rather than failing one step.
      - name: Assert zero retired-plugin dispatches and zero unresolved dispatch targets in live surfaces (registry scripts/retired-plugins.json)
        run: |
          set -euo pipefail
          python3 scripts/check-external-dispatch.py

  version-bump-gate:
    name: Version-bump gate (feature branches must not touch versions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Load-bearing here, unlike the two guards above. This gate anchors on
          # the MERGE-BASE with origin/main; the default shallow checkout has no
          # origin/main ref and no merge-base, under which the gate can only
          # degrade to a vacuous pass. Do not remove — the vacuity assertion in
          # the step below fails the build if this is dropped.
          fetch-depth: 0
          # Check out the PR HEAD, not the auto-generated merge ref. Merge-base
          # anchoring is what makes "untouched" immune to main's version
          # advancing after the fork; on a merge ref the merge-base collapses
          # onto main's tip and that property is lost. Empty on
          # workflow_dispatch, where checkout falls back to the default ref.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert no plugin version was touched on this branch
        run: |
          set +e
          set -uo pipefail
          # `set +e` above is load-bearing and must stay first. Actions runs this
          # block as `bash -e {0}`, so -e is inherited before line 1 executes, and
          # `set -uo pipefail` does NOT clear an inherited -e — only `set +e` does.
          # Without it the guard's non-zero exit aborts the step at the capture
          # below: a bare red with no envelope, no violation list, no fix hint.
          # The failing status is preserved by the terminal `exit "$rc"`, not by -e.
          python3 scripts/check-version-bump.py > version-gate.json 2> version-gate.err
          rc=$?
          cat version-gate.json
          cat version-gate.err >&2

          if [ "$rc" -eq 2 ]; then
            echo "::error::version-bump gate errored"
            exit 1
          fi

          # Graded twice from ONE invocation. The script exits 0 both when the
          # gate passed AND when it could not compare anything (status
          # "degraded" — base ref unresolvable), so the exit code alone cannot
          # tell "clean" from "never actually checked". Deliberately NOT a
          # second invocation: re-running the script would grade a different run
          # than the one that gated the build.
          python3 - <<'PY'
          import json, sys
          d = json.load(open("version-gate.json")).get("data") or {}
          if d.get("status") == "degraded":
              sys.exit("version-bump gate is VACUOUS (status: degraded) — %s\n"
                       "It compared nothing. This usually means fetch-depth: 0 "
                       "was removed from the checkout step." % d.get("degraded_reason"))
          print("version-bump gate ran for real (status: %s)" % d.get("status"))
          PY
          vrc=$?
          [ "$vrc" -eq 0 ] || exit 1
          exit "$rc"

  retirement-ledger-gate:
    name: Retirement-ledger gate (a skill retirement accounts for its trigger phrases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Load-bearing, for the same reason as the version-bump gate above.
          # This gate anchors on the MERGE-BASE with origin/main and reads the
          # deleted SKILL.md's own base-side blob; the default shallow checkout
          # has neither, under which the gate can only degrade to a vacuous
          # pass. Do not remove — the vacuity assertion in the step below fails
          # the build if this is dropped.
          fetch-depth: 0
          # Check out the PR HEAD, not the auto-generated merge ref. On a merge
          # ref the merge-base collapses onto main's tip, so a skill main
          # retired after the fork would be read as this branch's deletion.
          # Empty on workflow_dispatch, where checkout falls back to the
          # default ref.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert every deleted skill's trigger phrases are accounted for
        run: |
          # `set +e` FIRST, and it is load-bearing. GitHub runs a `run:` block as
          # `bash -e {0}`, and `set -uo pipefail` does NOT clear an inherited -e.
          # Without this the step aborts on the capture line below the moment the
          # guard exits non-zero, so the envelope, the violation list and the
          # FIX_HINTS block never reach the log and an author who trips the gate
          # sees a bare red with no remedy — on a guard whose entire remedial
          # surface is that stderr. The failing exit is preserved regardless: the
          # step ends with an explicit `exit "$rc"`.
          set +e
          set -uo pipefail
          python3 scripts/check-retirement-ledger.py > retirement-gate.json 2> retirement-gate.err
          rc=$?
          cat retirement-gate.json
          cat retirement-gate.err >&2

          if [ "$rc" -eq 2 ]; then
            echo "::error::retirement-ledger gate errored"
            exit 1
          fi

          # Graded twice from ONE invocation, exactly as the version-bump gate
          # is. The script exits 0 both when the gate passed AND when it could
          # not compare anything (status "degraded" — base ref unresolvable),
          # so the exit code alone cannot tell "clean" from "never actually
          # checked". Deliberately NOT a second invocation: re-running the
          # script would grade a different run than the one that gated the
          # build.
          python3 - <<'PY'
          import json, sys
          d = json.load(open("retirement-gate.json")).get("data") or {}
          if d.get("status") == "degraded":
              sys.exit("retirement-ledger gate is VACUOUS (status: degraded) — %s\n"
                       "It compared nothing. This usually means fetch-depth: 0 "
                       "was removed from the checkout step." % d.get("degraded_reason"))
          print("retirement-ledger gate ran for real (status: %s)" % d.get("status"))
          PY
          vrc=$?
          [ "$vrc" -eq 0 ] || exit 1
          exit "$rc"

  plugin-test-suites:
    name: Plugin test suites (discover and run tests/*.sh)
    runs-on: ubuntu-latest
    # The full sequential sweep measures ~3.5 minutes locally; this is headroom
    # for a slower runner, not a target.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The shallow default is load-bearing here — in the OPPOSITE direction
        # from version-bump-gate above, so do not copy its fetch-depth: 0.
        # tests/test_check_version_bump.sh case 10 runs the real version gate
        # against the checked-out tree. With full history origin/main resolves,
        # that case grades the tree for real, and a genuine version-touched
        # finding would fail this sweep IN ADDITION TO the dedicated
        # version-bump-gate job — one defect reported twice, and mislabelled
        # here as a test-suite failure. Shallow, the gate reports
        # status: degraded / clean: true and exits 0, so this job grades the
        # suites and the runner while version-bump-gate keeps owning the
        # tree's version state.

      - name: Discover and run every plugin and repo-root test suite
        run: |
          set +e
          set -uo pipefail
          # `set +e` above is load-bearing and must stay first. Actions runs this
          # block as `bash -e {0}`, so -e is inherited before line 1 executes, and
          # `set -uo pipefail` does NOT clear an inherited -e — only `set +e` does.
          # Without it a failing sweep aborts the step at the runner command itself,
          # so `rc=$?`, the per-suite annotation loop and the terminal exit are all
          # unreachable: a bare red naming no failing suite, on the one job whose
          # whole purpose is to name them.
          # The failing status is preserved by the terminal `exit "$rc"`, not by -e.
          python3 scripts/run-plugin-tests.py > plugin-tests.json
          rc=$?

          # The runner's own progress and per-failure output already reached the
          # log on stderr (only stdout was redirected), so this adds the one
          # thing it cannot emit itself: a GitHub annotation per failing suite.
          python3 - <<'PY'
          import json
          d = json.load(open("plugin-tests.json")).get("data") or {}
          for suite in d.get("failed_suites", []):
              print("::error file=%s::test suite failed: %s" % (suite, suite))
          PY

          exit "$rc"

  result-line-plainness-guard:
    name: Result-line plainness guard (no escape sequence in discovered suites)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard reads the working
        # tree at this commit, not git history. Do NOT copy version-bump-gate's
        # fetch-depth: 0 — that is load-bearing only for its merge-base anchor.

      - name: Assert no discovered suite wraps a result line in an escape sequence
        run: |
          set -euo pipefail
          python3 scripts/check-result-line-plainness.py

  mutation-recipe-harness-guard:
    name: Mutation-recipe harness guard (recorded paths use the stable marketplace install)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard reads the working
        # tree at this commit, not git history. Do NOT copy version-bump-gate's
        # fetch-depth: 0 — that is load-bearing only for its merge-base anchor.

      - name: Assert recorded mutation recipes use the stable harness path
        run: |
          set -euo pipefail
          python3 scripts/check-mutation-recipe-harness.py

  case-id-pairing-guard:
    name: Case-id pairing guard (every FAIL arm has a same-id green twin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard reads the working
        # tree at this commit, not git history. Do NOT copy version-bump-gate's
        # fetch-depth: 0 — that is load-bearing only for its merge-base anchor.

      - name: Assert every FAIL arm has a reachable same-id green twin
        run: |
          set -euo pipefail
          python3 scripts/check-case-id-pairing.py

  output-style-placement-guard:
    name: Output-style placement guard (registers live at plugin root and resolve in-plugin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard walks the working
        # tree at this commit, not git history. Do NOT copy version-bump-gate's
        # fetch-depth: 0 — that is load-bearing only for its merge-base anchor.

      - name: Assert output-styles sit at the plugin root and resolve in-plugin
        run: |
          set -euo pipefail
          python3 scripts/check-output-style-placement.py

  skill-spec-guard:
    name: Skill-spec guard (every SKILL.md meets the published Agent Skills standard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard walks the working
        # tree at this commit, not git history.

      - name: Assert name, description, length and progressive-disclosure rules
        run: |
          set -euo pipefail
          python3 scripts/check-skill-spec.py

  mcp-tool-grant-guard:
    name: MCP agent-grant guard (agent bodies call only servers their frontmatter grants)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard reads the working
        # tree at this commit, not git history. Do NOT copy version-bump-gate's
        # fetch-depth: 0 — that is load-bearing only for its merge-base anchor.

      - name: Assert every documented MCP call site is granted and registered
        run: |
          set -euo pipefail
          python3 scripts/check-mcp-tool-grant.py

  attribution-path-guard:
    name: Attribution path guard (every path a live attribution surface claims resolves)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard reads the tracked
        # index at this commit via `git ls-files`, not git history. Do NOT copy
        # version-bump-gate's fetch-depth: 0 — that is load-bearing only for its
        # merge-base anchor.

      - name: Assert every path claimed by a live attribution surface resolves
        run: |
          set -euo pipefail
          python3 scripts/check-attribution-path-integrity.py

  readme-inventory-sync-guard:
    name: README inventory-sync guard (root README counts match live directories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard globs the working
        # tree at this commit and reads one file, not git history. Do NOT copy
        # version-bump-gate's fetch-depth: 0 — that is load-bearing only for its
        # merge-base anchor.

      - name: Assert every root README inventory count matches its live directory count
        run: |
          set -euo pipefail
          python3 scripts/check-readme-inventory-sync.py

  code-span-nesting-guard:
    name: Code-span nesting guard (no single-backtick span enclosing another)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard reads the tracked
        # index at this commit via `git ls-files`, not git history. Do NOT copy
        # version-bump-gate's fetch-depth: 0 — that is load-bearing only for its
        # merge-base anchor.

      - name: Assert no markdown file nests a code span inside another code span
        run: |
          set -euo pipefail
          python3 scripts/check-code-span-nesting.py

  marketplace-manifest-sync-guard:
    name: Marketplace manifest-sync guard (entry description mirrors plugin.json, keywords stay a subset)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is sufficient: the guard reads two manifests
        # at this commit, not git history. Do NOT copy version-bump-gate's
        # fetch-depth: 0 — that is load-bearing only for its merge-base anchor.

      - name: Assert every marketplace entry description mirrors its plugin.json and its keywords stay a subset
        run: |
          set -euo pipefail
          python3 scripts/check-marketplace-manifest-sync.py
